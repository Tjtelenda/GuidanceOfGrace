<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Guidance of Grace Overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <main class="overlay" id="overlay">
    <header class="dragbar">
      <div><span class="grace">✦</span><strong>Guidance of Grace</strong></div>
      <button id="close" aria-label="Hide overlay">×</button>
    </header>
    <section class="current">
      <p class="eyebrow">CURRENT READ</p>
      <h1 id="area">Waiting for save…</h1>
      <p id="character" class="muted"></p>
      <div class="chips"><span id="readiness" class="chip">No level read</span><span id="role" class="chip"></span></div>
    </section>
    <section id="mapTargetSection" class="panel map-target hidden"><p class="eyebrow">PINNED LOCATION</p><h2 id="mapTargetName"></h2><p id="mapTargetLocation"></p><p id="mapTargetHint" class="muted"></p><button id="openMapTarget">Open map in full companion →</button></section>
    <section id="dialogueRule" class="warning note hidden"></section>
    <section id="warnings" class="stack"></section>
    <section id="npcsSection" class="panel hidden">
      <p class="eyebrow">NPCs WORTH CHECKING HERE</p>
      <div id="npcs" class="list"></div>
    </section>
    <section id="suggestionsSection" class="panel hidden">
      <p class="eyebrow">IF YOU WANT SOMETHING TO DO</p>
      <div id="suggestions" class="list"></div>
    </section>
    <footer>
      <button id="openApp">Open full companion</button>
      <span><span id="hotkey">Ctrl+Shift+G</span><small id="mapHotkey"></small></span>
    </footer>
  </main>
  <script src="overlay.js"></script>
</body>
</html>
